[tips-and-tricks-item-category-name]
amu=AutoModuleUpgrade

[tips-and-tricks-item-name]
amu-overview=Automatic module objectives

[tips-and-tricks-item-description]
amu-overview=AutoModuleUpgrade detects the current module objective of each machine. Quality modules are never replaced by another category. Productivity layouts keep enough productivity to reach the recipe cap, then use available speed modules in redundant slots. Use [item=amu-selection-tool] to schedule, exclude, preview, or re-enable machines. In the scan window, right-click the search button to rescan a surface and right-click the camera button to pause it.
