[mod-name]
AutoModuleUpgrade=Auto Module Upgrade

[mod-description]
AutoModuleUpgrade=Automatically upgrades modules in buildings using logistic network request proxies.

[shortcut-name]
amu_toggle_scan_window=Toggle AutoModuleUpgrade scan window
amu_get_selection_tool=AutoModuleUpgrade area tool

[custom-input-name]
amu_toggle_scan_window=Toggle AutoModuleUpgrade scan window
amu_get_selection_tool=Get AutoModuleUpgrade area tool

[item-name]
amu-selection-tool=AutoModuleUpgrade area tool

[item-description]
amu-selection-tool=Left-drag schedules machines. Shift+left excludes them. Right-drag previews objectives. Shift+right includes them again.

[mod-setting-name]
amu-scan-planets=Scan planets
amu-scan-space-platforms=Scan space platforms
amu-scan-interval-seconds=Scan interval
amu-scan-chunks-per-step=Chunks per scan step
amu-scan-entities-per-step=Entities per scan step
amu-queue-size-per-surface=Queue size per surface
amu-optimize-productivity-cap=Optimize productivity cap

[mod-setting-description]
amu-scan-planets=Allow AutoModuleUpgrade to scan planet surfaces.
amu-scan-space-platforms=Allow AutoModuleUpgrade to scan stopped space platforms. Platform upgrades use the current planet's rocket-silo logistic networks for item availability.
amu-scan-interval-seconds=Seconds between automatic full scan cycles. Higher values reduce average script load.
amu-scan-chunks-per-step=Maximum chunks inspected each scheduler update. Lower values reduce spikes but make full scans take longer.
amu-scan-entities-per-step=Maximum candidate entities evaluated each scheduler update. Lower values reduce average script load but make full scans take longer.
amu-queue-size-per-surface=Maximum buildings queued per surface per scan cycle. Lower values spread upgrade work over more cycles.
amu-optimize-productivity-cap=Replace productivity modules with speed modules only when the recipe remains at its productivity cap.

