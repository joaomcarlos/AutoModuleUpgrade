[mod-setting-description]
amu-scan-planets=Permite analisar superfícies planetárias e superfícies adicionadas por mods.
amu-scan-space-platforms=Permite analisar plataformas espaciais usando os itens disponíveis no hub.
amu-scan-interval-seconds=Segundos entre ciclos automáticos. Valores maiores reduzem a carga média do script.
amu-scan-chunks-per-step=Máximo de chunks inspecionados por atualização durante a indexação inicial.
amu-scan-entities-per-step=Máximo de entidades avaliadas por atualização.
amu-queue-size-per-surface=Máximo de máquinas agendadas por superfície em cada ciclo.
amu-optimize-productivity-cap=Substitui módulos de produtividade por velocidade apenas quando a receita continua no limite de produtividade.

