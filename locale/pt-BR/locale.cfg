[tips-and-tricks-item-category-name]
amu=AutoModuleUpgrade

[tips-and-tricks-item-name]
amu-overview=Objetivos automáticos de módulos

[tips-and-tricks-item-description]
amu-overview=O AutoModuleUpgrade deteta o objetivo atual de cada máquina. Módulos de qualidade nunca são substituídos por outra categoria. Configurações de produtividade mantêm os módulos necessários para atingir o limite da receita e usam módulos de velocidade nos slots redundantes. Use [item=amu-selection-tool] para agendar, excluir, prever ou reativar máquinas. Na janela, use o botão direito na pesquisa para analisar novamente uma superfície e na câmara para a pausar.
